# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.caching=true

# Mod Properties
mod_name=Create Slugma
mod_id=createslugma
mod_description= A Create Mod and Cobblemon Mod Addon that adds the Slugma Burner to Minecraft.

# Extra Properties
mod_version=1.0.3
mod_icon=assets/createslugma/icon.png
author=R3charged
repository=https://github.com/R3charged/Create-Slugma
license=CC-BY-NC-4.0
# client / server / * (both)
environment=*
maven_group=com.r3charged.createslugma


generated_file_name_addon=-1.21.1
archives_base_name=createslugma-1.21.1
supported_minecraft_versions=1.21.1

base_minecraft_version=1.21.1

architectury_version=9.2.14


# Cobblemon Version
cobblemon_version=1.6.1

# ===================================================================================
# NEOFORGE
# ===================================================================================
neo_version=21.1.129
loader_version_range=[1,)

kotlinforforge_version=5.5.0

# Create - NeoForge
# https://github.com/Creators-of-Create/Create/wiki/Depending-on-Create
create_neo_version = 6.0.4-53
ponder_neo_version = 1.0.46
registrate_neo_version = MC1.21-1.3.0+62
flywheel_neo_version = 1.0.2


# ===================================================================================
# FABRIC
# ===================================================================================
#https://fabricmc.net/develop/
enableFabric=false
yarn_mappings=1.20.1+build.10
fabric_loader_version=0.15.11
# Fabric API
fabric_version=0.92.2+1.20.1

# Create - Fabric
create_fabric_version=0.5.1-f-build.1335+mc1.20.1


enabled_platforms = neoforge
#fabric

geckolib_version=4.4.6
# If you have a minimum version for Cobblemon works, e.g. It will just work on >= 1.5
# You should define it on both fabric/src/resources/fabric.mod.json
# And forge/src/main/resources/META-INF/mods.toml